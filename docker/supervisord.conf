[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:rust-core]
command=/usr/local/bin/earthgrid-core --data-dir /data serve --host 127.0.0.1 --port 8401
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=1
startsecs=2

[program:python-api]
command=uvicorn earthgrid.main:app --host 0.0.0.0 --port 8400 --workers 1
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10
startsecs=3
