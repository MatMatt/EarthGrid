[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:earthgrid]
command=/usr/local/bin/earthgrid-core --data-dir /data serve --host 0.0.0.0 --port 8400
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=1
startsecs=2
