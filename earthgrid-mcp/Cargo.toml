[package]
name = "earthgrid-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for EarthGrid — lets AI agents trigger fetches, query coverage, and search the catalog"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"