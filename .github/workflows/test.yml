name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libclang-dev libnetcdf-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture
      - name: Clippy
        working-directory: earthgrid-core
        run: cargo clippy -- -D warnings 2>&1 || true

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: brew install gdal pkg-config llvm netcdf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
        env:
          GDAL_HOME: /opt/homebrew/opt/gdal
          PKG_CONFIG_PATH: /opt/homebrew/opt/gdal/lib/pkgconfig
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture
        env:
          GDAL_HOME: /opt/homebrew/opt/gdal
          PKG_CONFIG_PATH: /opt/homebrew/opt/gdal/lib/pkgconfig
