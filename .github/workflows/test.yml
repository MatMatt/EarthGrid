name: Test

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libclang-dev libnetcdf-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture
      - name: Clippy
        working-directory: earthgrid-core
        run: cargo clippy -- -D warnings 2>&1 || true

  test-macos:
    runs-on: macos-latest
    if: false  # disabled — brew tap trust issues on CI
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL
        run: brew install gdal pkg-config llvm netcdf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture

  test-windows:
    runs-on: windows-latest
    if: false  # disabled — GDAL linking issues on Windows CI
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
      - name: Install GDAL
        run: conda install -y gdal libnetcdf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture