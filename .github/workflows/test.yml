name: Test

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libclang-dev libnetcdf-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture
      - name: Clippy
        working-directory: earthgrid-core
        run: cargo clippy -- -D warnings 2>&1 || true

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: brew install gdal pkg-config llvm netcdf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
        env:
          GDAL_HOME: /opt/homebrew/opt/gdal
          PKG_CONFIG_PATH: /opt/homebrew/opt/gdal/lib/pkgconfig
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture
        env:
          GDAL_HOME: /opt/homebrew/opt/gdal
          PKG_CONFIG_PATH: /opt/homebrew/opt/gdal/lib/pkgconfig

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          channels: conda-forge
          activate-environment: test
          environment-file: ""
      - name: Install GDAL
        run: conda install -y gdal libnetcdf pkg-config clang libclang
      - name: Set GDAL env
        run: |
          CONDA_PREFIX=$(conda info --base)/envs/test
          echo "GDAL_HOME=$CONDA_PREFIX/Library" >> $GITHUB_ENV
          echo "GDAL_LIB_DIR=$CONDA_PREFIX/Library/lib" >> $GITHUB_ENV
          echo "GDAL_INCLUDE_DIR=$CONDA_PREFIX/Library/include" >> $GITHUB_ENV
          echo "$CONDA_PREFIX/Library/bin" >> $GITHUB_PATH
      - name: Create gdal.lib alias
        shell: pwsh
        run: |
          $lib = "$env:CONDA_PREFIX\Library\lib"
          $bin = "$env:CONDA_PREFIX\Library\bin"
          $src = Get-ChildItem "$lib" -Filter "gdal*.lib" | Select-Object -First 1
          if ($src) {
            Copy-Item $src.FullName "$lib\gdal.lib" -Force
            Copy-Item $src.FullName "$bin\gdal.lib" -Force
          } else {
            Write-Host "No gdal*.lib found in $lib, skipping alias"
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --all-targets
      - name: Test
        working-directory: earthgrid-core
        run: cargo test -- --nocapture