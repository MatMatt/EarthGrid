name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --release
      - name: Strip binary
        run: strip earthgrid-core/target/release/earthgrid-core
      - name: Package
        run: |
          mkdir -p dist
          cp earthgrid-core/target/release/earthgrid-core dist/earthgrid-linux-x86_64
          cd dist && tar czf earthgrid-linux-x86_64.tar.gz earthgrid-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/earthgrid-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: brew install gdal pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --release
        env:
          GDAL_HOME: /opt/homebrew/opt/gdal
          PKG_CONFIG_PATH: /opt/homebrew/opt/gdal/lib/pkgconfig
      - name: Strip binary
        run: strip earthgrid-core/target/release/earthgrid-core
      - name: Package
        run: |
          mkdir -p dist
          cp earthgrid-core/target/release/earthgrid-core dist/earthgrid-macos-arm64
          cd dist && tar czf earthgrid-macos-arm64.tar.gz earthgrid-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/earthgrid-macos-arm64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
          activate-environment: build
          environment-file: ""
      - name: Install GDAL
        run: conda install -y gdal pkg-config
      - name: Set GDAL env
        run: |
          CONDA_PREFIX=$(conda info --base)/envs/build
          echo "GDAL_HOME=$CONDA_PREFIX/Library" >> $GITHUB_ENV
          echo "GDAL_LIB_DIR=$CONDA_PREFIX/Library/lib" >> $GITHUB_ENV
          echo "GDAL_INCLUDE_DIR=$CONDA_PREFIX/Library/include" >> $GITHUB_ENV
          echo "$CONDA_PREFIX/Library/bin" >> $GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: earthgrid-core
      - name: Build
        working-directory: earthgrid-core
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          copy earthgrid-core\target\release\earthgrid-core.exe dist\earthgrid-windows-x86_64.exe
          Compress-Archive -Path dist\earthgrid-windows-x86_64.exe -DestinationPath dist\earthgrid-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/earthgrid-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-x86_64/earthgrid-linux-x86_64.tar.gz
            artifacts/macos-arm64/earthgrid-macos-arm64.tar.gz
            artifacts/windows-x86_64/earthgrid-windows-x86_64.zip
          generate_release_notes: true
